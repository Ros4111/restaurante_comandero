name: restaurante_tpv
description: TPV para restaurante - Sunmi V2
publish_to: 'none'
version: 1.0.20

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.11.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  sunmi_printer_plus: ^4.1.1
  intl: ^0.20.2
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  esc_pos_printer_plus: ^0.1.0
  esc_pos_utils_plus: ^2.0.4
