  nfc_manager: ^4.2.1
  speech_to_text: ^7.0.0
  battery_plus: ^7.0.0
  print_bluetooth_thermal: ^1.2.1
  tutorial_coach_mark: ^1.3.3
  audioplayers: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
